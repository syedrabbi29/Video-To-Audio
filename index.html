<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Video to Audio Converter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --cream:#FFF7F5;
    --card:#FFFFFF;
    --card-border:#FBE1EC;
    --plum:#4B2E44;
    --plum-soft:#8C7089;
    --rose:#FF8FAE;
    --lavender:#B98EE0;
    --mint:#37B378;
    --mint-bg:#F0FBF5;
    --mint-border:#CDEEDC;
    --coral:#E85D72;
    --coral-bg:#FFF1F3;
    --coral-border:#FAD2DA;
    --field-bg:#FFFAFB;
    --field-border:#F3D9E6;
    --track:#FCE4EE;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100%;
    background:var(--cream);
    background-image:
        radial-gradient(circle at 8% 0%, #FFE3EE 0%, transparent 45%),
        radial-gradient(circle at 100% 15%, #F1E3FB 0%, transparent 40%);
    color:var(--plum);
    font-family:'Nunito',Arial,Helvetica,sans-serif;
    padding:20px 16px 32px;
}

html{ height:100%; }

.app{
    width:100%;
    max-width:480px;
    margin:auto;
}

.header{
    text-align:center;
    padding:10px 5px 24px;
}

.logo{
    width:64px;
    height:64px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(140deg,var(--rose),var(--lavender));
    box-shadow:0 10px 26px rgba(226,120,178,.35);
}

.logo svg{ width:30px; height:30px; }

h1{
    margin-top:16px;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--plum);
}

.subtitle{
    color:var(--plum-soft);
    font-size:13px;
    margin-top:6px;
    line-height:1.5;
}

.card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:24px;
    padding:20px;
    box-shadow:0 18px 40px rgba(190,120,180,.10);
}

.drop{
    display:block;
    border:1.5px dashed #F0BFD8;
    border-radius:18px;
    padding:30px 15px;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s, background-color .2s;
    background:var(--field-bg);
}

.drop:hover{
    border-color:var(--rose);
    background:#FFF1F6;
}

.upload-icon{
    width:46px;
    height:46px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.upload-icon svg{ width:100%; height:100%; }

.drop-title{
    font-family:'Quicksand',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--plum);
}

.drop-sub{
    margin-top:6px;
    font-size:12px;
    color:var(--plum-soft);
}

#fileInput{
    display:none;
}

.file-card{
    display:none;
    margin-top:14px;
    padding:13px 14px;
    border-radius:16px;
    background:var(--field-bg);
    border:1px solid var(--field-border);
    display:none;
    align-items:center;
    gap:12px;
}

.file-card.show{ display:flex; }

.file-card-icon{
    width:34px;
    height:34px;
    flex:0 0 auto;
    border-radius:11px;
    background:linear-gradient(140deg,var(--rose),var(--lavender));
    display:flex;
    align-items:center;
    justify-content:center;
}

.file-card-icon svg{ width:17px; height:17px; }

.file-text{ min-width:0; }

.file-name{
    font-size:13.5px;
    font-weight:700;
    word-break:break-all;
    color:var(--plum);
}

.file-meta{
    color:var(--plum-soft);
    font-size:11.5px;
    margin-top:3px;
}

video{
    width:100%;
    max-height:260px;
    margin-top:14px;
    border-radius:16px;
    background:#000;
    display:none;
}

.settings{
    display:none;
    margin-top:18px;
}

.setting{
    margin-bottom:13px;
}

.setting label{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--plum-soft);
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
}

.setting label svg{ width:14px; height:14px; flex:0 0 auto; }

select{
    width:100%;
    padding:13px 14px;
    color:var(--plum);
    font-family:'Nunito',sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:13px;
    outline:none;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B98EE0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:16px;
}

select:focus{
    border-color:var(--rose);
}

.convert{
    width:100%;
    border:0;
    border-radius:15px;
    padding:15px;
    margin-top:5px;
    color:#fff;
    font-family:'Quicksand',sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.2px;
    background:linear-gradient(135deg,var(--rose),var(--lavender));
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:transform .15s, box-shadow .15s;
    box-shadow:0 10px 24px rgba(226,120,178,.30);
}

.convert svg{ width:18px; height:18px; }

.convert:active:not(:disabled){
    transform:scale(.98);
}

.convert:disabled{
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
}

.progress-box{
    display:none;
    margin-top:20px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:700;
    color:var(--plum-soft);
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:9px;
    background:var(--track);
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,var(--rose),var(--lavender));
    transition:width .2s;
}

.status{
    text-align:center;
    color:var(--plum-soft);
    font-size:12px;
    margin-top:10px;
}

.result{
    display:none;
    margin-top:18px;
    padding:16px;
    background:var(--mint-bg);
    border:1px solid var(--mint-border);
    border-radius:17px;
    animation:bloom .38s ease;
}

@keyframes bloom{
    from{ opacity:0; transform:scale(.96); }
    to{ opacity:1; transform:scale(1); }
}

.result-title{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--mint);
    font-family:'Quicksand',sans-serif;
    font-size:14.5px;
    font-weight:700;
    margin-bottom:13px;
}

.result-title svg{ width:19px; height:19px; flex:0 0 auto; }

audio{
    width:100%;
}

.download{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    margin-top:13px;
    background:var(--mint);
    color:white;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s;
}

.download svg{ width:17px; height:17px; }

.download:active{ transform:scale(.98); }

.error{
    display:none;
    margin-top:18px;
    padding:16px;
    background:var(--coral-bg);
    border:1px solid var(--coral-border);
    border-radius:17px;
}

.error-title{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--coral);
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:14.5px;
    margin-bottom:10px;
}

.error-title svg{ width:18px; height:18px; flex:0 0 auto; }

.error-reason{
    color:#7A3B45;
    font-size:13px;
    line-height:1.55;
    margin-bottom:12px;
}

details{
    margin-top:6px;
}

summary{
    display:flex;
    align-items:center;
    gap:6px;
    color:#B4707D;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    list-style:none;
}

summary::-webkit-details-marker{ display:none; }

summary svg{ width:13px; height:13px; }

.error-log{
    margin-top:9px;
    padding:12px;
    border-radius:11px;
    background:#3A2530;
    color:#E6C3CC;
    font-family:monospace;
    font-size:10px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:200px;
    overflow:auto;
}

.retry{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:1px solid var(--coral-border);
    border-radius:13px;
    background:#fff;
    color:var(--coral);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.retry svg{ width:15px; height:15px; }

.footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#B49AAE;
    font-size:10.5px;
    margin-top:18px;
}

.footer svg{ width:12px; height:12px; flex:0 0 auto; }

@media (prefers-reduced-motion: reduce){
    .result{ animation:none; }
    *{ transition:none !important; }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
        </div>
        <h1>Video to Audio</h1>
        <div class="subtitle">
            Turn your video clips into audio, right here in your browser
        </div>
    </div>

    <div class="card">

        <label class="drop" for="fileInput">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="url(#gradIcon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradIcon" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#FF8FAE"/>
                            <stop offset="1" stop-color="#B98EE0"/>
                        </linearGradient>
                    </defs>
                    <rect x="2.5" y="5" width="14" height="14" rx="3"/>
                    <path d="M16.5 9.5 21 7v10l-4.5-2.5"/>
                </svg>
            </div>
            <div class="drop-title">Choose a video</div>
            <div class="drop-sub">
                MP4, WebM, MOV, MKV and other supported formats
            </div>
        </label>

        <input id="fileInput" type="file" accept="video/*">

        <div class="file-card" id="fileCard">
            <div class="file-card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="6" width="13" height="12" rx="2.5"/>
                    <path d="M16 10.5 21 8v8l-5-2.5"/>
                </svg>
            </div>
            <div class="file-text">
                <div class="file-name" id="fileName"></div>
                <div class="file-meta" id="fileMeta"></div>
            </div>
        </div>

        <video id="video" controls></video>

        <div class="settings" id="settings">

            <div class="setting">
                <label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="#B98EE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                    Audio format
                </label>

                <select id="format">
                    <option value="mp3">MP3</option>
                    <option value="aac">AAC</option>
                    <option value="wav">WAV</option>
                </select>
            </div>

            <div class="setting" id="qualityBox">

                <label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="#B98EE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    MP3 quality
                </label>

                <select id="quality">
                    <option value="128k">128 kbps — Smaller file</option>
                    <option value="192k" selected>192 kbps — Recommended</option>
                    <option value="320k">320 kbps — High quality</option>
                </select>

            </div>

            <button class="convert" id="convert">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
                Convert to audio
            </button>

        </div>

        <div class="progress-box" id="progressBox">

            <div class="progress-head">
                <span id="progressText">Preparing...</span>
                <span id="percentage">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status" id="status">
                Starting...
            </div>

        </div>

        <div class="result" id="result">

            <div class="result-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9.5"/>
                    <path d="M8.5 12.5 11 15l5-6"/>
                </svg>
                Your audio is ready
            </div>

            <audio id="audio" controls></audio>

            <button class="download" id="download">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v13"/>
                    <path d="M7 11l5 5 5-5"/>
                    <path d="M4 20h16"/>
                </svg>
                Download audio
            </button>

        </div>

        <div class="error" id="error">

            <div class="error-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 1 21h22L12 2z"/>
                    <path d="M12 9v5"/>

            </div>

            <div class="error-reason" id="errorReason"></div>

            <details>
                <summary>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>

            </details>

            <button class="retry" id="retry">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 1 2.64 6.36"/>
                    <path d="M3 21v-6h6"/>

                Try again
            </button>

        </div>

    </div>

    <div class="footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        Your video is processed locally in your browser — nothing is uploaded
    </div>

</div>

<script type="module">

import { FFmpeg } from
"https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";

import {
    fetchFile,
    toBlobURL
} from
"https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";


const fileInput =
    document.getElementById("fileInput");

const fileCard =
    document.getElementById("fileCard");

const fileName =
    document.getElementById("fileName");

const fileMeta =
    document.getElementById("fileMeta");

const video =
    document.getElementById("video");

const settings =
    document.getElementById("settings");

const format =
    document.getElementById("format");

const qualityBox =
    document.getElementById("qualityBox");

const quality =
    document.getElementById("quality");

const convert =
    document.getElementById("convert");

const progressBox =
    document.getElementById("progressBox");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const percentage =
    document.getElementById("percentage");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const audio =
    document.getElementById("audio");

const download =
    document.getElementById("download");

const error =
    document.getElementById("error");

const errorReason =
    document.getElementById("errorReason");

const errorLog =
    document.getElementById("errorLog");

const retry =
    document.getElementById("retry");


let selectedFile = null;
let outputURL = null;
let ffmpeg = null;
let ffmpegReady = false;
let currentInputName = null;
let currentOutputName = null;


/* =========================
   File Selection
========================= */

fileInput.addEventListener("change", () => {

    const file = fileInput.files[0];

    if(!file) return;

    selectFile(file);

});


function selectFile(file){

    hideError();

    selectedFile = file;

    fileName.textContent = file.name;

    fileMeta.textContent =
        formatBytes(file.size)
        + " • "
        + (file.type || "Unknown video type");

    fileCard.classList.add("show");

    video.src =
        URL.createObjectURL(file);

    video.style.display = "block";

    settings.style.display = "block";

    result.style.display = "none";

    audio.removeAttribute("src");

}


/* =========================
   Format UI
========================= */

format.addEventListener("change", () => {

    qualityBox.style.display =
        format.value === "mp3"
        ? "block"
        : "none";

});


/* =========================
   FFmpeg Loading
========================= */

const FFMPEG_SOURCES = [

    {
        core:
            "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm",
        worker:
            "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js"
    },

    {
        core:
            "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm",
        worker:
            "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js"
    }

];


/* ===== Local cache for FFmpeg engine files (Cache Storage API) =====
   Once downloaded, these files never change for a given version, so
   we keep them in the browser's Cache Storage. Next visit reuses
   them instantly with no network request at all. */

const FFMPEG_CACHE_NAME = "ffmpeg-engine-cache-v1";

async function getFromCache(url){

    if(!("caches" in window))
        return null;

    try{

        const cache =
            await caches.open(FFMPEG_CACHE_NAME);

        const match =
            await cache.match(url);

        if(!match)
            return null;

        return await match.blob();

    }catch(e){

        return null;

    }

}

async function saveToCache(url, blob, mimeType){

    if(!("caches" in window))
        return;

    try{

        const cache =
            await caches.open(FFMPEG_CACHE_NAME);

        await cache.put(
            url,
            new Response(blob, {
                headers: {"Content-Type": mimeType}
            })
        );

    }catch(e){

        // Cache write failing is not critical — conversion still
        // works, it just won't be instant next time.

    }

}


/* Fetch a URL manually (instead of toBlobURL) so we can show real
   download progress and detect a stalled/frozen connection instead
   of hanging forever with no feedback. Checks the local cache first. */

async function fetchWithProgress(url, mimeType, onProgress, stallTimeoutMs){

    const cachedBlob = await getFromCache(url);

    if(cachedBlob){

        onProgress(1, cachedBlob.size, cachedBlob.size);

        return cachedBlob;

    }

    stallTimeoutMs = stallTimeoutMs || 20000;

    return new Promise(async (resolve, reject) => {

        const controller = new AbortController();
        let stallTimer;

        function resetStallTimer(){

            clearTimeout(stallTimer);

            stallTimer = setTimeout(() => {

                controller.abort();

            }, stallTimeoutMs);

        }

        function stallMessage(){

            return (
                "Download stalled — no data received for "
                + Math.round(stallTimeoutMs / 1000)
                + "s while fetching "
                + url
                + ". The network may be too slow, or this source is blocked on your network."
            );

        }

        resetStallTimer();

        try{

            const response =
                await fetch(url, {signal: controller.signal});

            if(!response.ok){

                clearTimeout(stallTimer);

                reject(new Error(
                    "HTTP " + response.status + " while fetching " + url
                ));

                return;

            }

            const contentLength =
                response.headers.get("Content-Length");

            const total =
                contentLength ? parseInt(contentLength, 10) : 0;

            if(!response.body){

                const blob = await response.blob();

                clearTimeout(stallTimer);

                onProgress(1, blob.size, blob.size);

                const typedBlob = new Blob([blob], {type: mimeType});

                saveToCache(url, typedBlob, mimeType);

                resolve(typedBlob);

                return;

            }

            const reader = response.body.getReader();

            let received = 0;

            const chunks = [];

            while(true){

                const {done, value} = await reader.read();

                if(done) break;

                resetStallTimer();

                chunks.push(value);

                received += value.length;

                onProgress(
                    total ? received / total : 0,
                    received,
                    total
                );

            }

            clearTimeout(stallTimer);

            const finalBlob = new Blob(chunks, {type: mimeType});

            saveToCache(url, finalBlob, mimeType);

            resolve(finalBlob);

        }catch(err){

            clearTimeout(stallTimer);

            if(err.name === "AbortError"){

                reject(new Error(stallMessage()));

                return;

            }

            reject(err);

        }

    });

}


function formatMB(bytes){

    return (bytes / (1024 * 1024)).toFixed(1) + "MB";

}


async function loadFileWithProgress(label, url, mimeType){

    const blob = await fetchWithProgress(

        url,
        mimeType,

        (frac, received, total) => {

            const pct =
                Math.min(100, Math.round(frac * 100));

            progressBar.style.width = pct + "%";

            percentage.textContent = pct + "%";

            progressText.textContent =
                "Downloading "
                + label
                + "... "
                + (total
                    ? formatMB(received) + " / " + formatMB(total)
                    : formatMB(received));

        }

    );

    return URL.createObjectURL(blob);

}


/* worker.js (ESM build) internally does:
       import { ... } from "./const.js";
       import { ... } from "./errors.js";
   Those relative imports break once worker.js is turned into a
   blob: URL, because the blob has no real sibling files — the
   worker silently fails to start and ffmpeg.load() hangs forever
   with no error. Fix: fetch const.js/errors.js too, turn THEM into
   blob URLs, and rewrite worker.js's import lines to point at those
   blob URLs before creating worker.js's own blob. */

async function buildPatchedWorkerURL(workerScriptURL){

    const workerDir =
        workerScriptURL.substring(
            0,
            workerScriptURL.lastIndexOf("/") + 1
        );

    async function fetchText(url){

        const cachedBlob = await getFromCache(url);

        if(cachedBlob){
            return await cachedBlob.text();
        }

        const res = await fetch(url);

        if(!res.ok){

            throw new Error(
                "HTTP " + res.status + " while fetching " + url
            );

        }

        const text = await res.text();

        saveToCache(
            url,
            new Blob([text], {type: "text/javascript"}),
            "text/javascript"
        );

        return text;

    }

    const [workerText, constText, errorsText] =
        await Promise.all([
            fetchText(workerScriptURL),
            fetchText(workerDir + "const.js"),
            fetchText(workerDir + "errors.js")
        ]);

    const constBlobURL =
        URL.createObjectURL(
            new Blob([constText], {type: "text/javascript"})
        );

    const errorsBlobURL =
        URL.createObjectURL(
            new Blob([errorsText], {type: "text/javascript"})
        );

    const patchedWorkerText =
        workerText
            .replace(
                'from "./const.js"',
                `from "${constBlobURL}"`
            )
            .replace(
                'from "./errors.js"',
                `from "${errorsBlobURL}"`
            );

    return URL.createObjectURL(
        new Blob([patchedWorkerText], {type: "text/javascript"})
    );

}


/* Wrap a promise with a timeout so a silent hang (rather than an
   error) can never freeze the UI forever. */

function withTimeout(promise, ms, message){

    return new Promise((resolve, reject) => {

        const timer = setTimeout(() => {

            reject(new Error(message));

        }, ms);

        promise
            .then(value => {
                clearTimeout(timer);
                resolve(value);
            })
            .catch(err => {
                clearTimeout(timer);
                reject(err);
            });

    });

}


async function initializeFFmpeg(){

    if(ffmpegReady)
        return;

    ffmpeg = new FFmpeg();


    ffmpeg.on("progress", ({progress}) => {

        if(!isFinite(progress))
            return;

        const value =
            Math.max(
                0,
                Math.min(
                    100,
                    Math.round(progress * 100)
                )
            );

        progressBar.style.width =
            value + "%";

        percentage.textContent =
            value + "%";

        progressText.textContent =
            "Converting...";

    });


    ffmpeg.on("log", ({message}) => {

        console.log("[FFmpeg]", message);

    });


    let lastError = null;


    for(const src of FFMPEG_SOURCES){

        try{

            status.textContent =
                "Loading engine from "
                + new URL(src.core).hostname
                + "...";

            const coreURL =
                await loadFileWithProgress(
                    "core.js",
                    `${src.core}/ffmpeg-core.js`,
                    "text/javascript"
                );

            const wasmURL =
                await loadFileWithProgress(
                    "core.wasm",
                    `${src.core}/ffmpeg-core.wasm`,
                    "application/wasm"
                );

            const classWorkerURL =
                await buildPatchedWorkerURL(src.worker);

            status.textContent =
                "Starting engine...";

            progressText.textContent =
                "Starting engine...";

            await withTimeout(
                ffmpeg.load({
                    coreURL,
                    wasmURL,
                    classWorkerURL
                }),
                60000,
                "FFmpeg engine did not finish starting within 60 seconds "
                + "(the worker likely failed to initialize). "
                + "Try again, or switch to Wi-Fi / a different browser."
            );

            ffmpegReady = true;

            return;

        }catch(err){

            lastError = err;

            console.error(
                "[FFmpeg] Failed to load from",
                src.core,
                err
            );

        }

    }


    const detail =
        lastError && lastError.message
        ? lastError.message
        : String(lastError);


    throw new Error(
        "FFmpeg engine could not be loaded from any available source "
        + "(tried: "
        + FFMPEG_SOURCES.map(s => new URL(s.core).hostname).join(", ")
        + "). Underlying error: "
        + detail
    );

}


/* =========================
   Conversion
========================= */

convert.addEventListener("click", async () => {

    await startConversion();

});


retry.addEventListener("click", async () => {

    await startConversion();

});


async function startConversion(){

    if(!selectedFile){

        showError(
            "No video was selected.",
            "Please choose a video file before starting conversion."
        );

        return;

    }


    resetProgress();

    hideError();

    result.style.display = "none";

    convert.disabled = true;


    try{

        await initializeFFmpeg();

        status.textContent =
            "Preparing video...";


        const extension =
            getExtension(selectedFile.name);


        currentInputName =
            "input_" +
            Date.now() +
            extension;


        currentOutputName =
            "audio_" +
            Date.now() +
            "." +
            format.value;


        await ffmpeg.writeFile(
            currentInputName,
            await fetchFile(selectedFile)
        );


        status.textContent =
            "Extracting audio...";


        let command = [];


        if(format.value === "mp3"){

            command = [

                "-i",
                currentInputName,

                "-vn",

                "-map",
                "0:a:0",

                "-c:a",
                "libmp3lame",

                "-b:a",
                quality.value,

                "-ar",
                "44100",

                currentOutputName

            ];

        }


        else if(format.value === "aac"){

            command = [

                "-i",
                currentInputName,

                "-vn",

                "-map",
                "0:a:0",

                "-c:a",
                "aac",

                "-b:a",
                "192k",

                currentOutputName

            ];

        }


        else if(format.value === "wav"){

            command = [

                "-i",
                currentInputName,

                "-vn",

                "-map",
                "0:a:0",

                "-c:a",
                "pcm_s16le",

                "-ar",
                "44100",

                currentOutputName

            ];

        }


        const exitCode =
            await ffmpeg.exec(command);


        if(exitCode !== 0){

            throw new Error(
                "FFmpeg exited with code " +
                exitCode
            );

        }


        status.textContent =
            "Reading converted audio...";


        const data =
            await ffmpeg.readFile(
                currentOutputName
            );


        if(!data || data.length === 0){

            throw new Error(
                "FFmpeg created an empty output file."
            );

        }


        let mime =
            "audio/mpeg";


        if(format.value === "wav")
            mime = "audio/wav";


        if(format.value === "aac")
            mime = "audio/aac";


        const blob =
            new Blob(
                [data.buffer],
                {type:mime}
            );


        if(blob.size === 0){

            throw new Error(
                "The converted audio is empty."
            );

        }


        if(outputURL){

            URL.revokeObjectURL(
                outputURL
            );

        }


        outputURL =
            URL.createObjectURL(blob);


        audio.src =
            outputURL;


        result.style.display =
            "block";


        progressBar.style.width =
            "100%";


        percentage.textContent =
            "100%";


        progressText.textContent =
            "Completed";


        status.textContent =
            "Audio is ready to download.";


        download.onclick = () => {

            const a =
                document.createElement("a");

            a.href =
                outputURL;

            const original =
                selectedFile.name
                .replace(/\.[^/.]+$/, "");


            a.download =
                original +
                "." +
                format.value;


            document.body.appendChild(a);

            a.click();

            a.remove();

        };


        await cleanupFFmpegFiles();


    }catch(err){

        console.error(err);

        const message =
            extractErrorMessage(err);


        const reason =
            detectReason(message);


        showError(
            reason,
            message
        );


        progressText.textContent =
            "Failed";

        status.textContent =
            "See the error details below.";

    }


    convert.disabled = false;

}


/* =========================
   Error Reason Detection
========================= */

function detectReason(message){

    const text =
        String(message).toLowerCase();


    if(
        text.includes("does not contain any stream") ||
        text.includes("stream map") ||
        text.includes("matches no streams") ||
        text.includes("0:a")
    ){

        return "This video does not appear to contain a usable audio track.";

    }


    if(
        text.includes("invalid data") ||
        text.includes("moov atom") ||
        text.includes("invalid argument")
    ){

        return "The video file may be damaged, incomplete, or encoded in a format FFmpeg cannot read.";

    }


    if(
        text.includes("unknown decoder") ||
        text.includes("unsupported codec") ||
        text.includes("decoder")
    ){

        return "The audio/video codec inside this file is not supported by the loaded FFmpeg build.";

    }


    if(
        text.includes("memory") ||
        text.includes("out of memory") ||
        text.includes("allocation")
    ){

        return "The browser ran out of available memory. Try a smaller video or close other apps/tabs.";

    }


    if(
        text.includes("network") ||
        text.includes("fetch") ||
        text.includes("load")
    ){

        return "The FFmpeg engine could not be loaded correctly. Check your internet connection and try again.";

    }


    if(
        text.includes("permission") ||
        text.includes("not allowed")
    ){

        return "The browser blocked access to the selected file or conversion operation.";

    }


    if(
        text.includes("wasm")
    ){

        return "The browser could not properly run the FFmpeg WebAssembly engine.";

    }


    return "FFmpeg could not complete the conversion. Check the technical error below for the exact reason.";

}


/* =========================
   Progress Reset
========================= */

function resetProgress(){

    progressBox.style.display =
        "block";

    progressBar.style.width =
        "0%";

    percentage.textContent =
        "0%";

    progressText.textContent =
        "Preparing...";

    status.textContent =
        "Starting conversion...";

}


/* =========================
   Cleanup
========================= */

async function cleanupFFmpegFiles(){

    try{

        if(currentInputName){

            await ffmpeg.deleteFile(
                currentInputName
            );

        }

    }catch(e){}


    try{

        if(currentOutputName){

            await ffmpeg.deleteFile(
                currentOutputName
            );

        }

    }catch(e){}

}


/* =========================
   Error UI
========================= */

function showError(reason, technical){

    errorReason.textContent =
        reason;

    errorLog.textContent =
        technical;

    error.style.display =
        "block";

}


function hideError(){

    error.style.display =
        "none";

}


/* =========================
   Helpers
========================= */

function extractErrorMessage(err){

    if(!err)
        return "Unknown error.";

    if(err.message)
        return err.message;

    return String(err);

}


function getExtension(name){

    const match =
        name.match(/\.[^/.]+$/);

    return match
        ? match[0].toLowerCase()
        : ".mp4";

}


function formatBytes(bytes){

    if(!bytes)
        return "0 Bytes";


    const units =
        ["Bytes","KB","MB","GB"];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        (bytes /
        Math.pow(1024,i))
        .toFixed(i === 0 ? 0 : 2)
        + " "
        + units[i]
    );

}
